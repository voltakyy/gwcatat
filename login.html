<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — gwcatat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@200..800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Manrope', system-ui, sans-serif; }
    .font-display { font-family: 'Montserrat', 'Manrope', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-[#FAF8F4] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg border border-[#264653]/10 p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-[#264653] flex items-center justify-center mx-auto shadow-md">
        <svg viewBox="0 0 40 40" class="w-10 h-10 stroke-[#C89B3C] fill-none stroke-[2.4]">
          <circle cx="20" cy="20" r="17" />
          <path d="M13 28 L13 13 L20 22 L27 13 L27 28" />
          <path d="M20 22 L20 28" />
        </svg>
      </div>
      <h1 class="font-display font-bold text-2xl text-[#264653] mt-4">gwcatat</h1>
      <p class="text-sm text-[#2D2D2D]/60 mt-1">Buat catatan harian keuangan dengan mudah.</p>
    </div>

    <!-- Pesan Ajakan -->
    <div class="text-center mb-8">
      <h2 class="text-lg font-semibold text-[#2D2D2D]">Selamat Datang!</h2>
      <p class="text-sm text-[#2D2D2D]/60 mt-2">Silakan masuk menggunakan akun Google kamu untuk melanjutkan ke aplikasi.</p>
    </div>

    <!-- Google Sign-In via Supabase -->
    <div class="flex justify-center mb-4">
      <button id="googleBtn"
        class="w-full flex items-center justify-center gap-3 bg-[#264653] hover:opacity-90 active:opacity-80 text-white font-semibold text-sm rounded-xl px-4 py-3 transition disabled:opacity-60">
        <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c0 1.1-.7 2.7-2.2 3.8l-.1.1 3.2 2.5.2.1c2-1.9 3.9-4.7 3.9-8.7z"/>
          <path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.6 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5l-.1.1-3.1 2.4-.1.1C3.9 21.3 7.7 24 12 24z"/>
          <path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.1-2.4-.1.1C.7 9.4 0 10.6 0 12s.7 2.6 1.9 3.9l3.3-1.5z"/>
          <path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.7 0 3.9 2.7 1.9 7.1l3.3 2.6c.9-2.9 3.6-5 6.8-5z"/>
        </svg>
        <span id="googleBtnText">Masuk dengan Google</span>
      </button>
    </div>
    <p id="loginError" class="hidden text-center text-xs text-[#C0604A] font-medium mt-2"></p>

    <p class="text-center text-xs text-[#2D2D2D]/40 mt-8">Dengan masuk, kamu setuju dengan Kebijakan Privasi kami.</p>
  </div>

  <script>
    // ===== LOGIN VIA SUPABASE AUTH (Google) =====
    const googleBtn = document.getElementById('googleBtn');
    const googleBtnText = document.getElementById('googleBtnText');
    const loginError = document.getElementById('loginError');

    function showError(msg) {
      loginError.textContent = msg;
      loginError.classList.remove('hidden');
    }

    async function boot() {
      if (!window.sb) {
        showError('Gagal memuat layanan login. Periksa koneksi lalu muat ulang halaman.');
        return;
      }
      try {
        const { data } = await window.sb.auth.getSession();
        if (data.session) {
          window.location.href = 'index.html';
          return;
        }
      } catch (e) { console.warn('cek sesi gagal:', e); }
    }

    googleBtn?.addEventListener('click', async () => {
      loginError.classList.add('hidden');
      googleBtn.disabled = true;
      googleBtnText.textContent = 'Membuka Google...';
      try {
        const redirectTo = new URL('index.html', window.location.href).href;
        const { error } = await window.sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo }
        });
        if (error) throw error;
      } catch (e) {
        console.error(e);
        showError('Login gagal: ' + (e.message || 'coba lagi.'));
        googleBtn.disabled = false;
        googleBtnText.textContent = 'Masuk dengan Google';
      }
    });

    boot();
  </script>
</body>
</html>
